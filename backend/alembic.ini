# Alembic, run from backend/: `uv run alembic upgrade head`. The database URL comes from DATABASE_URL (app settings),
# never from this file, so no credentials live in git.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# 0001_baseline.py, 0002_specs.py, ...: numbered by hand with --rev-id, so the order is readable in a listing.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os
timezone = UTC

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
